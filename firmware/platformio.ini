; ===========================================================================
;  Smart Rental Wheelchair — firmware build config (ESP32 WROOM-32)
;  Open the firmware/ folder in VS Code + PlatformIO.
; ===========================================================================
[platformio]
default_envs = esp32-s3


[env:esp32-s3]
platform      = espressif32 @ 6.9.0
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 115200

; 16MB flash + ESP32-S3-WROOM-1 N16R8.
; Note: PSRAM physically present but qio_opi crashes this module's bootloader.
; Our firmware uses only 48KB/320KB RAM (14.7%), so PSRAM is not needed.
board_build.flash_size          = 16MB
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_upload.before_reset       = usb_reset
board_build.flash_mode          = dio
board_build.partitions          = partitions.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<*>
    -<actuators_test.cpp>
    -<dht_test.cpp>
    -<ds18b20_test.cpp>
    -<gps_test.cpp>
    -<gyro_acc_test.cpp>
    -<mpu6500_test.cpp>
    -<sw520d_test.cpp>
    -<dummy.cpp>

lib_deps =
    mikalhart/TinyGPSPlus
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    bblanchon/ArduinoJson

; ===========================================================================
;  Dedicated Wheelchair Fleet Build Targets (WCHAIR-002 through WCHAIR-005)
; ===========================================================================
[env:wchair-002]
extends = env:esp32-s3
build_flags =
    ${env:esp32-s3.build_flags}
    '-DDEVICE_ID="WCHAIR-002"'

[env:wchair-003]
extends = env:esp32-s3
build_flags =
    ${env:esp32-s3.build_flags}
    '-DDEVICE_ID="WCHAIR-003"'
    -DGPS_RX_PIN_OVERRIDE=17
    -DGPS_TX_PIN_OVERRIDE=18
    -DGPS_BAUD_OVERRIDE=38400
    -DTEMP_SENSOR_REQUIRED=0

[env:wchair-004]
extends = env:esp32-s3
build_flags =
    ${env:esp32-s3.build_flags}
    '-DDEVICE_ID="WCHAIR-004"'
    -DGPS_RX_PIN_OVERRIDE=17
    -DGPS_TX_PIN_OVERRIDE=18
    ; No DS18B20 probe is fitted on this chair, so requiring one buys no safety
    ; and costs everything: areSafetySensorsHealthy() returns false forever, the
    ; chair sits in SAFE_FAULT, and markFirmwareValid() can never pass — which
    ; rolled 1.2.8 back 90s after a clean install. Over-temperature protection is
    ; UNAFFECTED: the cut-off still fires on any real reading (actuators.cpp
    ; only tests `!isnan(tempBatt)`). This drops the "a probe must exist" check,
    ; nothing else. Same flag WCHAIR-003 already carries for the same reason.
    -DTEMP_SENSOR_REQUIRED=0
    ; Emergency wheel unlock — WCHAIR-004 is the only chair with the second
    ; relay fitted, so only this build defines the pin. Every other chair
    ; compiles with no reference to GPIO 41 and no new behaviour at all.
    -DWHEEL_UNLOCK_RELAY_PIN=41
    ; Emergency power cut — third relay, WCHAIR-004 only. GPIO 39 is free on
    ; this module and sits in the same J3 row as 41 (42/41/40/39); 38 is the
    ; onboard RGB LED and 35-37 are bonded to the octal PSRAM inside the
    ; WROOM-1, so they are not usable.
    -DPOWER_RELAY_PIN=39
    ; Mute the tamper siren after 25s so a chair with no uplink cannot be left
    ; screaming with no way to stop it. Sound only — the tamper stays latched
    ; and still needs CLEAR_TAMPER.
    -DTAMPER_BUZZER_TIMEOUT_S=25

[env:wchair-005]
extends = env:esp32-s3
build_flags =
    ${env:esp32-s3.build_flags}
    '-DDEVICE_ID="WCHAIR-005"'

; --- Alternate target: plain ESP32 WROOM-32 (retained for reference) ---
[env:esp32-wroom32]
platform      = espressif32 @ 6.9.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
lib_deps      = ${env:esp32-s3.lib_deps}


